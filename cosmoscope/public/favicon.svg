<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- The pale blue dot: Earth as one point of light, the same as the PALE app icon. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3D8BFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1B4FA8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#05070C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="45%" cy="42%" r="60%">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="0.7" stop-color="#CFE6FF"/>
      <stop offset="1" stop-color="#9CCBFF"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05070C"/>
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="104" fill="url(#dot)"/>
</svg>
